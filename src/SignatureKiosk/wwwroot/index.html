<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>HELIX SignTablet</title>
  <link rel="stylesheet" href="/kiosk.css" />
</head>
<body>
  <div id="app">
    <!-- Slideshow layer -->
    <section id="slideshow" class="layer">
      <img id="slideA" class="slide" alt="" />
      <img id="slideB" class="slide" alt="" />
      <div id="slidesEmpty" class="empty hidden">Ожидание контента…</div>
    </section>

    <!-- Signing document layer -->
    <section id="document" class="layer hidden">
      <div class="doc-frame">
        <header class="doc-header">
          <h1 id="docTitle"></h1>
          <div id="docProgress" class="doc-progress"></div>
        </header>
        <main id="docBody" class="doc-body"></main>
        <footer id="docFooter" class="doc-footer"></footer>
      </div>
    </section>

    <!-- Enrollment (activation) layer -->
    <section id="enroll" class="layer hidden">
      <form id="enrollForm" class="enroll-box">
        <div class="enroll-badge">HELIX SignTablet</div>
        <h1>Активация планшета</h1>
        <p class="enroll-sub">Код активации выдаётся в админке. Введите его один раз - планшет запомнит доступ.</p>
        <input id="enrollCode" inputmode="text" autocomplete="one-time-code" placeholder="XXXX-XXXX" maxlength="9" />
        <button id="enrollBtn" type="submit" class="btn btn-primary">Активировать</button>
        <div id="enrollMsg" class="enroll-msg"></div>
      </form>
    </section>

    <!-- Barcode / QR scanning layer -->
    <section id="scan" class="layer hidden">
      <div class="scan-frame">
        <div class="scan-title">Поднесите код к камере</div>
        <div class="scan-window">
          <video id="scanVideo" playsinline muted></video>
          <div class="scan-reticle"></div>
        </div>
        <div id="scanMsg" class="scan-msg"></div>
        <button id="scanFlip" class="scan-flip hidden" type="button">Другая камера</button>
        <div id="scanResult" class="scan-result hidden">
          <div class="scan-check"></div>
          <div class="scan-ok">Код считан</div>
          <div id="scanCode" class="scan-code"></div>
        </div>
      </div>
    </section>

    <!-- Connection status -->
    <div id="statusOverlay" class="status hidden"><div class="status-box"><span id="statusText"></span></div></div>

    <!-- Identify overlay -->
    <div id="identifyOverlay" class="identify hidden">
      <div class="identify-code" id="identifyCode"></div>
      <div class="identify-name" id="identifyName"></div>
    </div>
  </div>

  <script src="/lib/signalr.min.js"></script>
  <script src="/lib/signature_pad.umd.min.js"></script>
  <script src="/lib/zxing-browser.min.js"></script>
  <script src="/kiosk.js"></script>
</body>
</html>
