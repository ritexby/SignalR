# nginx configuration for signalr.zrobim.it -> Signature Kiosk (Kestrel on 127.0.0.1:5080)
#
# SignalR uses WebSockets, so the Upgrade/Connection headers below are REQUIRED.
# You already terminate TLS and hold the certificate for this name, so only the
# reverse-proxy wiring matters here.
#
# If you already have a `server { server_name signalr.zrobim.it; ... }` block,
# just copy the `location /` block into it and add the `map` (once, at http level).

# --- put this ONCE, at http{} level (e.g. /etc/nginx/conf.d/websocket_upgrade.conf) ---
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name signalr.zrobim.it;

    # --- TLS: point these at your existing certificate ---
    ssl_certificate     /etc/letsencrypt/live/signalr.zrobim.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signalr.zrobim.it/privkey.pem;

    # Image uploads from the admin panel.
    client_max_body_size 32m;

    location / {
        proxy_pass         http://127.0.0.1:5080;
        proxy_http_version 1.1;

        # WebSocket upgrade (SignalR)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived realtime connections
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

